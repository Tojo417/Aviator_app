<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Aviator Predictor - By TOJO</title>
  
   <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e5cc4">
  
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #1e5cc4, #00c6ff);
  margin: 0;
  color: #333;
}
.header {
  background: rgba(0,0,0,0.3);
  color: white;
  padding: 10px;
  text-align: center;
  font-size: 16px;
  font-weight: bold;
}
#clock {
  font-size: 18px;
  margin-top: 5px;
  display: block;
}
.container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 80vh;
}
.card {
  background: white;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  width: 520px;
  text-align: center;
}
input {
  width: 50%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: 3px solid #ccc;
  font-size: 18px;
}
  

.time-input input {
    width:  10%;
    text-align: ;
    gap: 10px;
  
}
  
button {
  padding: 14px 24px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  margin: 12px;
  transition: transform 0.2s;
  font-size: 16px;
}
button:hover { transform: scale(1.05); }
.btn-primary { background: #1e5cc4; color: white; }
.btn-secondary { background: #ccc; }
.result {
  margin-top: 25px;
}
.result-box {
  margin: 15px 0;
  padding: 18px;
  border-radius: 14px;
  font-size: 20px;
  font-weight: bold;
  color: white;
  animation: fadeIn 1s ease;
}
.multiplier { background: #28a745; }   /* vert */
.round { background: #17a2b8; }        /* bleu turquoise */
.confidence { background: #ffc107; color:#333; }   /* jaune */
.extra { background: #6f42c1; }        /* violet */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
canvas {
  margin-top: 20px;
}
</style>
</head>
<body>

<div class="header">
✈️ Aviator Predictor - Dashboard Premium
<span id="clock"></span>
</div>

<div class="container">
<div class="card">
  <h3>Entrer les donnees </h3>
  <label>Dernier Multiplicateur</label><br>
  <input type="number" id="lastMult" placeholder="ex: 2.5"><br>
  
<label>Heure</label>
<div class="time-input">
<input type="number" id="hh" placeholder="HH">
<input type="number" id="mm" placeholder="MM">
</div>
  
  <label>#Code Hex</label><br>
  <input type="text" id="hex" placeholder="ex: A3F"><br>
  <label>#Code Décimal</label><br>
  <input type="number" id="dec" placeholder="ex: 127"><br>
  <button class="btn-primary" onclick="predict()">Lancer la Prédiction</button>
  <button class="btn-secondary" onclick="reset()">Réinitialiser</button>
  <div class="result" id="result"></div>
  <canvas id="confidenceChart" width="400" height="200"></canvas>
</div>
</div>

<script>
// Horloge en temps réel
function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerText = now.toLocaleTimeString();
}
setInterval(updateClock, 1000);

// Transition matrix simplifiée
const transitions = {
  faible: {faible:0.5, moyen:0.4, fort:0.1},
  moyen: {faible:0.3, moyen:0.4, fort:0.3},
  fort:  {faible:0.2, moyen:0.3, fort:0.5}
};

function getState(mult){
  if(mult<2) return "faible";
  else if(mult<=5) return "moyen";
  else return "fort";
}

function nextState(current){
  let r=Math.random(), sum=0;
  for(let s in transitions[current]){
    sum+=transitions[current][s];
    if(r<=sum) return s;
  }
  return "moyen";
}

let chart; // Chart.js instance

function predict(){
  let lastMult=parseFloat(document.getElementById("lastMult").value)||2.0;
  let hex=document.getElementById("hex").value||"A3F";
  let dec=parseInt(document.getElementById("dec").value)||127;

  let currentState=getState(lastMult);
  let next=nextState(currentState);

  let multiplier;
  if(next==="faible") multiplier=(Math.random()*1.5+1).toFixed(2);
  else if(next==="moyen") multiplier=(Math.random()*3+2).toFixed(2);
  else multiplier=(Math.random()*5+5).toFixed(2);

  let now=new Date();
  now.setMinutes(now.getMinutes()+1);
  let nextRound=now.toLocaleTimeString();

  let confidenceValue=(transitions[currentState][next]*100).toFixed(0);
  let confidence=confidenceValue+"%";

  document.getElementById("result").innerHTML=
    "<div class='result-box multiplier'>Prochain Multiplicateur: x"+multiplier+"</div>"+
    "<div class='result-box round'>Prochain Tour: "+nextRound+"</div>"+
    "<div class='result-box confidence'>Confiance: "+confidence+"</div>"+
    "<div class='result-box extra'>Heure actuelle: "+new Date().toLocaleTimeString()+"<br>"+
    "Code Hex: "+hex+" | Code Décimal: "+dec+"</div>";

  // Chart graphique dynamique
  const ctx=document.getElementById('confidenceChart').getContext('2d');
  if(chart) chart.destroy(); // reset chart
  chart=new Chart(ctx,{
    type:'doughnut',
    data:{
      labels:['Confiance','Incertitude'],
      datasets:[{
        data:[confidenceValue,100-confidenceValue],
        backgroundColor:['#28a745','#e0e0e0']
      }]
    },
    options:{
      responsive:true,
      plugins:{
        legend:{position:'bottom'},
        title:{display:true,text:'Niveau de Confiance'}
      }
    }
  });
}

function reset(){
  document.getElementById("lastMult").value="";
  document.getElementById("hex").value="";
  document.getElementById("dec").value="";
  document.getElementById("result").innerHTML="";
  if(chart) chart.destroy();
}
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("Service Worker enregistré"))
    .catch(err => console.error("Erreur SW:", err));
}
</script>
</body>
</html>
